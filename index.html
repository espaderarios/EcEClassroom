<script>
(function () {
  var config = {};

  window.elementSdk = {
    init: function (api) {
      
      if (api && api.defaultConfig) {
        config = Object.assign({}, api.defaultConfig);
      } else {
        config = {};
      }

    
      window.__elementApi = api;
    },

    setConfig: function (newConfig) {
      config = Object.assign({}, config, newConfig);

      
      if (
        window.__elementApi &&
        typeof window.__elementApi.onConfigChange === "function"
      ) {
        window.__elementApi.onConfigChange(config);
      }
    },

    getConfig: function () {
      return Object.assign({}, config);
    }
  };
})();
</script>

<script>
(function () {


window.getUser = function () {
  // Prefer durable localStorage; fall back to sessionStorage if available
  const fromLocal = localStorage.getItem("user");
  if (fromLocal) return JSON.parse(fromLocal);
  const fromSession = sessionStorage.getItem("user");
  if (fromSession) {
    // migrate session user back to local for persistence across refreshes
    localStorage.setItem("user", fromSession);
    return JSON.parse(fromSession);
  }
  return null;
};

window.setUser = function (user) {
  const json = JSON.stringify(user);
  localStorage.setItem("user", json);
  sessionStorage.setItem("user", json);
  try {
    localStorage.setItem('eceIntroSeen', 'true');
  } catch (err) {
    console.warn('Unable to persist intro state from setUser', err);
  }
};

window.logoutUser = function () {
  localStorage.removeItem("user");
  sessionStorage.removeItem("user");
};

function migrateLocalAccountData(oldId, newId) {
  if (!oldId || !newId || oldId === newId) {
    return;
  }

  const keysToUpdate = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key) continue;
    if (key.includes(oldId)) {
      keysToUpdate.push(key);
    }
  }

  keysToUpdate.forEach((originalKey) => {
    const storedValue = localStorage.getItem(originalKey);
    const migratedKey = originalKey.replace(oldId, newId);
    if (storedValue === null || migratedKey === originalKey) {
      return;
    }
    if (localStorage.getItem(migratedKey) === null) {
      localStorage.setItem(migratedKey, storedValue);
    }
    localStorage.removeItem(originalKey);
  });

  const updateArrayEntries = (storageKey, fields) => {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return;
      let changed = false;
      parsed.forEach((item) => {
        if (!item) return;
        fields.forEach((field) => {
          if (item[field] === oldId) {
            item[field] = newId;
            changed = true;
          }
        });
      });
      if (changed) {
        localStorage.setItem(storageKey, JSON.stringify(parsed));
      }
    } catch (err) {
      console.warn("Account migration skipped for", storageKey, err);
    }
  };

  updateArrayEntries("teacher_classes", ["teacherId"]);
  updateArrayEntries("student_enrolled_classes", ["studentId"]);
  updateArrayEntries("class_quizzes", ["teacherId", "studentId"]);
  updateArrayEntries("studentQuizScores", ["studentId"]);
}
const urlParams = new URLSearchParams(window.location.search);
const oauthStatus = urlParams.get('oauth_login');

if (oauthStatus === 'success') {
  const userId = urlParams.get('user_id');
  const userName = urlParams.get('user_name');
  const userEmail = urlParams.get('user_email');
  const googleId = urlParams.get('google_id');
  const picture = urlParams.get('picture');

  if (userId) {
    const pendingLinkUserId = localStorage.getItem('pending_google_link_user');

    if (pendingLinkUserId && pendingLinkUserId !== userId) {
      migrateLocalAccountData(pendingLinkUserId, userId);
    }

    const googleUser = {
      id: userId,
      name: userName || userEmail,
      email: userEmail,
      googleId: googleId || userId,
      googleEmail: userEmail,
      picture: picture || null,
      provider: 'google',
      authenticated: true
    };

    if (pendingLinkUserId) {
      googleUser.linkedUserId = pendingLinkUserId;

      fetch(`${getBackendUrl()}/auth/link-google`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ localUserId: pendingLinkUserId, googleUserId: userId })
      }).catch(err => console.log('Link sync failed:', err));

      localStorage.removeItem('pending_google_link_user');
    }

    setUser(googleUser);

    const studentProfile = JSON.parse(localStorage.getItem(`student_profile::${userId}`) || '{}');
    const updatedStudentProfile = {
      ...studentProfile,
      name: userName || studentProfile.name || '',
      email: userEmail || studentProfile.email || '',
      googleId: googleId || userId,
      googleEmail: userEmail,
      profilePictureUrl: picture || studentProfile.profilePictureUrl,
      id: userId
    };
    localStorage.setItem(`student_profile::${userId}`, JSON.stringify(updatedStudentProfile));

    const teacherProfile = JSON.parse(localStorage.getItem(`teacherProfile::${userId}`) || '{}');
    const updatedTeacherProfile = {
      ...teacherProfile,
      name: userName || teacherProfile.name || '',
      email: userEmail || teacherProfile.email || '',
      googleId: googleId || userId,
      googleEmail: userEmail,
      profilePictureUrl: picture || teacherProfile.profilePictureUrl,
      id: userId
    };
    localStorage.setItem(`teacherProfile::${userId}`, JSON.stringify(updatedTeacherProfile));

    window.currentStudent = {
      name: userName || updatedStudentProfile.name || '',
      id: userId,
      email: userEmail
    };
    localStorage.setItem('currentStudent', JSON.stringify(window.currentStudent));

    window.currentTeacher = {
      name: userName || updatedTeacherProfile.name || '',
      id: userId,
      email: userEmail
    };
    localStorage.setItem('currentTeacherId', userId);

    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

if (!getUser()) {
  const authFlagMatch = document.cookie.match(/google_authenticated=([^;]+)/);

  if (authFlagMatch && authFlagMatch[1] === 'true') {
    setUser({
      id: 'google_user_' + Date.now(),
      name: 'Google User',
      email: '',
      provider: 'google',
      authenticated: true
    });
  }
}

// Flag for data persistence - used to sync with backend conditionally
window.isAuthenticated = getUser()?.authenticated === true;

  function getStorageKey() {
    const user = getUser();
    return user ? `flashcards_${user.id}` : "flashcards_guest";
  }

  var handler = null;
  var data = [];
  var isSyncing = false;

  function load() {
    try {
      var stored = localStorage.getItem(getStorageKey());
      data = stored ? JSON.parse(stored) : [];
    } catch {
      data = [];
    }
  }

  function save() {
    localStorage.setItem(getStorageKey(), JSON.stringify(data));
  }

  function notify() {
    if (handler && typeof handler.onDataChanged === "function") {
      handler.onDataChanged(data.slice());
    }
  }

  function getBackendUrl() {
    // Use Worker for data, Render for AI
    // Worker handles CRUD for flashcards
    return 'https://ec-eclassroom-backend.espaderarios.workers.dev';
  }

  function getRenderBackendUrl() {
    // Always use Render backend for AI generation
    return 'https://eclassroom-backend.onrender.com';
  }

  async function syncToBackend(item, method = 'POST') {
    const user = getUser();
    if (!user || !user.authenticated) {
      console.log('[dataSdk] Sync skipped: User not authenticated');
      return;
    }
    if (!item || !item.id) {
      console.log('[dataSdk] Sync skipped: Invalid item');
      return;
    }

    try {
      const backendUrl = getBackendUrl();
      const shouldTargetItem = method === 'DELETE' || method === 'PUT' || method === 'PATCH';
      
      // Add userId to query params for all requests
      let endpoint = `${backendUrl}/api/flashcards?userId=${encodeURIComponent(user.id)}`;
      if (shouldTargetItem) {
        endpoint = `${backendUrl}/api/flashcards/${encodeURIComponent(item.id)}?userId=${encodeURIComponent(user.id)}`;
      }

      const requestInit = {
        method: method,
        headers: { 'Content-Type': 'application/json' }
      };

      if (method !== 'DELETE') {
        requestInit.body = JSON.stringify({ ...item, userId: user.id });
      }

      console.log(`[dataSdk] Syncing ${method} to backend:`, endpoint);
      const response = await fetch(endpoint, requestInit);
      
      if (!response.ok) {
        const errorText = await response.text();
        console.error(`[dataSdk] Backend sync failed (${response.status}):`, errorText);
        throw new Error(`Backend returned ${response.status}: ${errorText}`);
      }
      
      console.log(`[dataSdk] Successfully synced ${method} for item:`, item.id);
    } catch (error) {
      console.error('[dataSdk] Backend sync error:', error);
      throw error; // Re-throw so caller can handle it
    }
  }

  async function loadFromBackend() {
    const user = getUser();
    if (!user || !user.authenticated) return [];
    
    try {
      const backendUrl = getBackendUrl();
      const response = await fetch(`${backendUrl}/api/flashcards?userId=${encodeURIComponent(user.id)}`);
      if (!response.ok) return [];
      
      const items = await response.json();
      return Array.isArray(items) ? items : [];
    } catch (error) {
      console.log('Failed to load from backend:', error);
      return [];
    }
  }

  function generateId() {
    return (
      "id_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2, 8)
    );
  }

  window.dataSdk = {
    init: async function (h) {
      handler = h;
      
      // CRITICAL: Clear data array first to prevent cross-user contamination
      data = [];
      
      const user = getUser();
      
      // Load from backend FIRST if authenticated
      if (user && user.authenticated && !isSyncing) {
        isSyncing = true;
        try {
          console.log('[dataSdk] Loading data for user:', user.id);
          
          // Load from backend first
          const backendDataRaw = await loadFromBackend();
          const backendData = Array.isArray(backendDataRaw) ? backendDataRaw : [];

          console.log('[dataSdk] Loaded from backend:', backendData.length, 'items for', user.id);

          // ALWAYS use backend data as source of truth
          data = backendData;
          save(); // Save to user-specific localStorage key
          notify(); // Update UI with backend data
          
          console.log('[dataSdk] User', user.id, 'has', data.length, 'flashcards');

          // Then check for local-only items that need uploading
          load(); // Load from localStorage for this user
          const localData = data.slice();
          data = backendData; // Reset to backend data
          
          const backendIds = new Set(backendData.map(item => item && item.id).filter(Boolean));
          const pendingUploads = localData
            .filter(item => item && item.id && !backendIds.has(item.id))
            .map(item => syncToBackend(item, 'POST'));

          if (pendingUploads.length > 0) {
            console.log('[dataSdk] Uploading', pendingUploads.length, 'local-only items');
            Promise.allSettled(pendingUploads).then(results => {
              const failures = results.filter(result => result.status === 'rejected');
              if (failures.length) {
                console.log('[dataSdk] Create sync had', failures.length, 'failures');
              }
            });
          }
        } catch (error) {
          console.error('[dataSdk] Initial sync failed:', error);
          // Fallback to localStorage if backend fails
          load();
          notify();
        } finally {
          isSyncing = false;
        }
      } else {
        // Not authenticated, load from localStorage (guest mode)
        load();
        notify();
      }

      return { isOk: true };
    },

    create: async function (item) {
      var newItem = Object.assign({}, item, {
        id: generateId()
      });

      data.push(newItem);
      save();
      notify();
      
      // Sync to backend asynchronously but log errors
      syncToBackend(newItem, 'POST')
        .then(() => {
          console.log('[dataSdk] Card created and synced successfully');
        })
        .catch(err => {
          console.error('[dataSdk] Create sync failed:', err);
          // Show error to user
          if (window.showToast) {
            window.showToast('Warning: Card saved locally but not synced to cloud. Please check your connection.');
          }
        });

      return Promise.resolve({ isOk: true, item: newItem });
    },

    delete: async function (opts, silent) {
      if (!opts || !opts.id) {
        return Promise.resolve({ isOk: false });
      }

      const deletedItem = data.find(d => d.id === opts.id);
      data = data.filter(d => d.id !== opts.id);
      save();
      if (!silent) notify();
      
      // Sync deletion to backend asynchronously
      if (deletedItem) {
        syncToBackend(deletedItem, 'DELETE').catch(err => console.log('Delete sync failed:', err));
      }

      return Promise.resolve({ isOk: true });
    },

    update: async function (updatedItem) {
      if (!updatedItem || !updatedItem.id) {
        return Promise.resolve({ isOk: false });
      }

      data = data.map(d =>
        d.id === updatedItem.id ? updatedItem : d
      );

      save();
      notify();
      
      // Sync update to backend asynchronously (using PUT)
      syncToBackend(updatedItem, 'PUT').catch(err => console.log('Update sync failed:', err));

      return Promise.resolve({ isOk: true });
    },

    getAll: function () {
      return data.slice();
    }
  };

})();
</script>

<!-- PWA Installation -->
<script>
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallButton();
});

function showInstallButton() {
  const installBtn = document.createElement('button');
  installBtn.id = 'pwa-install-btn';
  installBtn.innerHTML = '📱 Install App';
  installBtn.className = 'pwa-install-btn';
  installBtn.onclick = installPWA;
  document.body.appendChild(installBtn);
}

async function installPWA() {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;

  if (outcome === 'accepted') {
    console.log('User accepted the install prompt');
  }

  deferredPrompt = null;
  document.getElementById('pwa-install-btn')?.remove();
}

window.addEventListener('appinstalled', () => {
  console.log('PWA was installed');
  deferredPrompt = null;
});

// Offline/Online event handlers
window.addEventListener('offline', () => {
  const offlineMsg = document.getElementById('offline-message');
  if (offlineMsg) offlineMsg.style.display = 'flex';
});

window.addEventListener('online', () => {
  const offlineMsg = document.getElementById('offline-message');
  if (offlineMsg) offlineMsg.style.display = 'none';
});

// Cache status indicator
function showCacheStatus(message, type = 'info') {
  const statusEl = document.getElementById('cache-status');
  if (!statusEl) {
    const el = document.createElement('div');
    el.id = 'cache-status';
    el.className = 'cache-status';
    document.body.appendChild(el);
  }

  const el = document.getElementById('cache-status');
  el.textContent = message;
  el.className = `cache-status ${type}`;

  setTimeout(() => {
    el.style.display = 'none';
  }, 3000);
}

// Listen for cache updates
if ('serviceWorker' in navigator) {
  const SW_RELOAD_FLAG_KEY = 'sw_last_reloaded_version';
  let isReloadingFromSw = false;
  const announceUpdating = () => {
    if (typeof showCacheStatus === 'function') {
      showCacheStatus('Update found. Reloading…', 'info');
    }
  };

  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data && event.data.type === 'cache-status') {
      showCacheStatus(event.data.message, event.data.status);
    }

    if (event.data && event.data.type === 'SW_UPDATE_ACTIVATED') {
      const nextVersion = String(event.data.version || 'unknown');
      const previousVersion = sessionStorage.getItem(SW_RELOAD_FLAG_KEY);

      if (previousVersion !== nextVersion && !isReloadingFromSw) {
        isReloadingFromSw = true;
        sessionStorage.setItem(SW_RELOAD_FLAG_KEY, nextVersion);
        announceUpdating();
        window.location.reload();
      }
    }
  });

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (isReloadingFromSw) return;
    isReloadingFromSw = true;
    announceUpdating();
    window.location.reload();
  });
}
</script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js?v=20260228e', { updateViaCache: 'none' }).then(registration => {
        const requestSkipWaiting = () => {
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        };

        if (registration.waiting) {
          requestSkipWaiting();
        }

        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if (!newWorker) return;

          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              requestSkipWaiting();
            }
          });
        });

        registration.update().catch(() => {});
        setInterval(() => registration.update().catch(() => {}), 10 * 60 * 1000);
        window.addEventListener('focus', () => registration.update().catch(() => {}));
      }).catch(err => {
