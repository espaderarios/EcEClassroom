<script>
(function () {
  var config = {};

  window.elementSdk = {
    init: function (api) {
      
      if (api && api.defaultConfig) {
        config = Object.assign({}, api.defaultConfig);
      } else {
        config = {};
      }

    
      window.__elementApi = api;
    },

    setConfig: function (newConfig) {
      config = Object.assign({}, config, newConfig);

      
      if (
        window.__elementApi &&
        typeof window.__elementApi.onConfigChange === "function"
      ) {
        window.__elementApi.onConfigChange(config);
      }
    },

    getConfig: function () {
      return Object.assign({}, config);
    }
  };
})();
</script>

<script>
(function () {


window.getUser = function () {
  // Prefer durable localStorage; fall back to sessionStorage if available
  const fromLocal = localStorage.getItem("user");
  if (fromLocal) return JSON.parse(fromLocal);
  const fromSession = sessionStorage.getItem("user");
  if (fromSession) {
    // migrate session user back to local for persistence across refreshes
    localStorage.setItem("user", fromSession);
    return JSON.parse(fromSession);
  }
  return null;
};

window.setUser = function (user) {
  const json = JSON.stringify(user);
  localStorage.setItem("user", json);
  sessionStorage.setItem("user", json);
};

window.logoutUser = function () {
  localStorage.removeItem("user");
  sessionStorage.removeItem("user");
};

if (!getUser()) {
  // Check for OAuth login success from URL parameters
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('oauth_login') && urlParams.get('oauth_login') === 'success') {
    const userId = urlParams.get('user_id');
    const userName = urlParams.get('user_name');
    const userEmail = urlParams.get('user_email');
    const googleId = urlParams.get('google_id');
    const picture = urlParams.get('picture');
    
    if (userId) {
      // Check if we're linking to an existing local account
      const pendingLinkUserId = localStorage.getItem('pending_google_link_user');
      
      const googleUser = {
        id: userId,
        name: userName || userEmail,
        email: userEmail,
        googleId: googleId,
        googleEmail: userEmail,
        picture: picture || null,
        provider: 'google',
        authenticated: true
      };
      
      if (pendingLinkUserId) {
        // Link this Google account to existing local user
        googleUser.linkedUserId = pendingLinkUserId;
        
        // Call backend to link accounts
        fetch('https://ec-eclassroom-backend.espaderarios.workers.dev/auth/link-google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ localUserId: pendingLinkUserId, googleUserId: userId })
        }).catch(err => console.log('Link sync failed:', err));
        
        localStorage.removeItem('pending_google_link_user');
      }
      
      setUser(googleUser);
      
      // Auto-populate student profile from Google account
      const studentProfile = JSON.parse(localStorage.getItem('student_profile') || '{}');
      const updatedStudentProfile = {
        ...studentProfile,
        name: userName || studentProfile.name || '',
        email: userEmail || studentProfile.email || '',
        googleId: googleId,
        googleEmail: userEmail,
        profilePictureUrl: picture || studentProfile.profilePictureUrl,
        id: pendingLinkUserId || studentProfile.id || userId
      };
      localStorage.setItem('student_profile', JSON.stringify(updatedStudentProfile));
      
      // Auto-populate teacher profile from Google account
      const teacherProfile = JSON.parse(localStorage.getItem('teacherProfile') || '{}');
      const updatedTeacherProfile = {
        ...teacherProfile,
        name: userName || teacherProfile.name || '',
        email: userEmail || teacherProfile.email || '',
        googleId: googleId,
        googleEmail: userEmail,
        profilePictureUrl: picture || teacherProfile.profilePictureUrl,
        id: pendingLinkUserId || teacherProfile.id || userId
      };
      localStorage.setItem('teacherProfile', JSON.stringify(updatedTeacherProfile));
      
      // Update currentStudent for backward compatibility
      window.currentStudent = {
        name: userName,
        id: updatedStudentProfile.id,
        email: userEmail
      };
      localStorage.setItem('currentStudent', JSON.stringify(window.currentStudent));
      
      // Clean up URL parameters
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }
  
  // Check for Google OAuth session cookie from Cloudflare Workers
  const cookieStr = document.cookie;
  const authFlagMatch = cookieStr.match(/google_authenticated=([^;]+)/);
  
  if (authFlagMatch && authFlagMatch[1] === 'true' && !getUser()) {
    // Try to parse session_user cookie if available (though it's HttpOnly so won't work)
    // Instead, we'll rely on the URL parameters set above
    // If somehow we get here without URL params, create a placeholder
    setUser({
      id: 'google_user_' + Date.now(),
      name: 'Google User',
      email: '',
      provider: 'google',
      authenticated: true
    });
  }
}

// Flag for data persistence - used to sync with backend conditionally
window.isAuthenticated = getUser()?.authenticated === true;

  function getStorageKey() {
    const user = getUser();
    return user ? `flashcards_${user.id}` : "flashcards_guest";
  }

  var handler = null;
  var data = [];

  function load() {
    try {
      var stored = localStorage.getItem(getStorageKey());
      data = stored ? JSON.parse(stored) : [];
    } catch {
      data = [];
    }
  }

  function save() {
    localStorage.setItem(getStorageKey(), JSON.stringify(data));
  }

  function notify() {
    if (handler && typeof handler.onDataChanged === "function") {
      handler.onDataChanged(data.slice());
    }
  }

  function generateId() {
    return (
      "id_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2, 8)
    );
  }

  window.dataSdk = {
    init: function (h) {
      handler = h;
      load();
      notify();
      return Promise.resolve({ isOk: true });
    },

    create: function (item) {
      var newItem = Object.assign({}, item, {
        id: generateId()
      });

      data.push(newItem);
      save();
      notify();

      return Promise.resolve({ isOk: true, item: newItem });
    },

    delete: function (opts, silent) {
      if (!opts || !opts.id) {
        return Promise.resolve({ isOk: false });
      }

      data = data.filter(d => d.id !== opts.id);
      save();
      if (!silent) notify();

      return Promise.resolve({ isOk: true });
    },

    update: function (updatedItem) {
      if (!updatedItem || !updatedItem.id) {
        return Promise.resolve({ isOk: false });
      }

      data = data.map(d =>
        d.id === updatedItem.id ? updatedItem : d
      );

      save();
      notify();

      return Promise.resolve({ isOk: true });
    },

    getAll: function () {
      return data.slice();
    }
  };

})();
</script>

<!-- PWA Installation -->
<script>
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallButton();
});

function showInstallButton() {
  const installBtn = document.createElement('button');
  installBtn.id = 'pwa-install-btn';
  installBtn.innerHTML = '📱 Install App';
  installBtn.className = 'pwa-install-btn';
  installBtn.onclick = installPWA;
  document.body.appendChild(installBtn);
}

async function installPWA() {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;

  if (outcome === 'accepted') {
    console.log('User accepted the install prompt');
  }

  deferredPrompt = null;
  document.getElementById('pwa-install-btn')?.remove();
}

window.addEventListener('appinstalled', () => {
  console.log('PWA was installed');
  deferredPrompt = null;
});

// Offline/Online event handlers
window.addEventListener('offline', () => {
  const offlineMsg = document.getElementById('offline-message');
  if (offlineMsg) offlineMsg.style.display = 'flex';
});

window.addEventListener('online', () => {
  const offlineMsg = document.getElementById('offline-message');
  if (offlineMsg) offlineMsg.style.display = 'none';
});

// Cache status indicator
function showCacheStatus(message, type = 'info') {
  const statusEl = document.getElementById('cache-status');
  if (!statusEl) {
    const el = document.createElement('div');
    el.id = 'cache-status';
    el.className = 'cache-status';
    document.body.appendChild(el);
  }

  const el = document.getElementById('cache-status');
  el.textContent = message;
  el.className = `cache-status ${type}`;

  setTimeout(() => {
    el.style.display = 'none';
  }, 3000);
}

// Listen for cache updates
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data && event.data.type === 'cache-status') {
      showCacheStatus(event.data.message, event.data.status);
    }
  });
}
</script>

    if (typeof window.getTotalSets !== 'function') {
      window.getTotalSets = function () {
        const subjects = JSON.parse(localStorage.getItem('subjects') || '[]');
        let total = 0;
        subjects.forEach(subject => {
          if (subject && Array.isArray(subject.sets)) total += subject.sets.length;
        });
        return total;
      };
    }

  <!-- Dark Mode Script -->
  <script>
    // Initialize dark mode preference
    function initDarkMode() {
      const darkModeToggle = document.getElementById('theme-toggle');
      const appBody = document.getElementById('app-body');
      
      // Check for saved preference
      const savedMode = localStorage.getItem('theme-mode');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = savedMode ? savedMode === 'dark' : prefersDark;
      
      // Apply theme
      if (isDark) {
        appBody.classList.add('dark-mode');
        darkModeToggle.textContent = '☀️';
      } else {
        appBody.classList.add('light-mode');
        darkModeToggle.textContent = '🌙';
      }
      
      // Toggle handler
      darkModeToggle.addEventListener('click', () => {
        const isDarkMode = appBody.classList.contains('dark-mode');
        if (isDarkMode) {
          appBody.classList.remove('dark-mode');
          appBody.classList.add('light-mode');
          localStorage.setItem('theme-mode', 'light');
          darkModeToggle.textContent = '🌙';
        } else {
          appBody.classList.remove('light-mode');
          appBody.classList.add('dark-mode');
          localStorage.setItem('theme-mode', 'dark');
          darkModeToggle.textContent = '☀️';
        }
      });
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDarkMode);
    } else {
      initDarkMode();
    }
  </script>
